version: '3.8'

services:
  # Chainlink listener backend
  backend:
    build:
      context: ./synapsenet-backend/services
      dockerfile: Dockerfile
    container_name: synapsenet-backend
    ports:
      - "3001:3001"
      - "8090:8090"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - WS_PORT=8090
      - POLYGON_AMOY_RPC=https://rpc-amoy.polygon.technology
      - SEPOLIA_RPC=https://ethereum-sepolia.publicnode.com
      - CHAINLINK_CONTRACT=0x9b8e6d8b2417116f4ff9bc4e9b9f91a8a7d2f8e5
    networks:
      - synapsenet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./synapsenet-frontend
      dockerfile: Dockerfile
    container_name: synapsenet-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_WS_URL=ws://localhost:8090
      - VITE_API_URL=http://localhost:3001
      - VITE_CHAINLINK_CONTRACT=0x9b8e6d8b2417116f4ff9bc4e9b9f91a8a7d2f8e5
      - VITE_POLYGON_AMOY_RPC=https://rpc-amoy.polygon.technology
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - synapsenet
    restart: unless-stopped

networks:
  synapsenet:
    name: synapsenet_network
    driver: bridge

# Note: Linera microchains run locally, not in Docker
# Use: linera service --port 8080 (on host machine)
# The backend connects to Linera at http://localhost:8080 when ENABLE_LINERA=true
